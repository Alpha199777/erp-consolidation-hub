services:
  dolibarr-db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: dolidb
      MARIADB_USER: dolidbuser
      MARIADB_PASSWORD: dolidbpass
    volumes:
      - dolibarr-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  dolibarr:
    image: dolibarr/dolibarr:latest
    depends_on:
      dolibarr-db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      DOLI_DB_HOST: dolibarr-db
      DOLI_DB_NAME: dolidb
      DOLI_DB_USER: dolidbuser
      DOLI_DB_PASSWORD: dolidbpass
      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: admin
      DOLI_URL_ROOT: http://localhost:8081
      DOLI_INIT_DEMO: "1"
      DOLI_ENABLE_MODULES: Societe,Api
    volumes:
      - dolibarr-docs:/var/www/documents

volumes:
  dolibarr-db-data:
  dolibarr-docs: